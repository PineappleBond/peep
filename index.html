<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peep - 个人工具</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — reverse the 404.html redirect.
      // See public/404.html and https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search && l.search.slice(1, 2) === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- rtc-agent 脚本由 main.tsx 根据环境动态加载 -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
