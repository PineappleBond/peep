<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!--
      CSP（Content-Security-Policy）基础防护：
      - 阻止外部 <base> 标签劫持（base-uri）
      - 阻止页面被嵌入 iframe（frame-ancestors，meta 标签不支持此指令，
        建议在生产环境通过 HTTP 响应头补充完整 CSP）
      - 限制表单仅能提交到同源（form-action）
      完整 CSP（含 script-src / style-src）建议通过服务器 HTTP 响应头配置，
      见 vite.config.ts 的 preview 配置或部署平台的头信息配置。
    -->
    <meta http-equiv="Content-Security-Policy" content="base-uri 'self'; form-action 'self'" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#04060d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>紫微斗数 · 玄机排盘</title>
    <style>html,body{margin:0;background:#05070f}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
