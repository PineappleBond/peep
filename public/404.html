<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // When GitHub Pages serves a 404 for a client-side route (e.g. /peep/persons),
      // this script rewrites the URL to /peep/?/persons and redirects to index.html,
      // where the snippet in index.html restores the original path via history API.
      //
      // `pathSegmentsToKeep` matches the number of path segments in the repo base:
      // the site is hosted at https://<user>.github.io/peep/ → 1 segment ("peep").
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search
            ? '&' + l.search.slice(1).replace(/&/g, '~and~')
            : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
